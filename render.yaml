# Render Blueprint — deploys everything on Render: the FastAPI backend,
# a managed Postgres database, and the React frontend as a static site.
# In Render: New -> Blueprint -> point at this repo -> it reads this file automatically.

databases:
  - name: jwb-nexus-db
    plan: free
    databaseName: jwb_nexus
    user: jwb_user

services:
  # ---- Backend API ----
  - type: web
    name: jwb-nexus-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: jwb-nexus-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        value: "https://jwb-nexus-frontend.onrender.com,http://localhost:5173"
      - key: ANTHROPIC_API_KEY
        sync: false   # optional — add your own key in the Render dashboard to enable LLM-phrased AI answers

  # ---- Frontend (static site) ----
  - type: web
    name: jwb-nexus-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://jwb-nexus-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
